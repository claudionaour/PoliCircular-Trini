name: Compilar APK Android — PoliCircular

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Compilar APK instalable (Debug firmado)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir PoliCircular.apk como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PoliCircular-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
